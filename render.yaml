services:
  - type: web
    name: infomed-api
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build && npm run db:push && npm run db:seed
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: infomed-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: infomed-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: infomed-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
